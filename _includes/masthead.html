{% include base_path %}

<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><div class="navicon"></div></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg"><a href="{{ base_path }}/">{{ site.title }}</a></li>
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
              {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li class="masthead__menu-item"><a href="{{ domain }}{{ link.url }}">{{ link.title }}</a></li>
          {% endfor %}
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
    <a href="#" id="theme-toggle" class="theme-toggle" role="button" aria-label="Switch between light and dark mode" title="Switch between light and dark mode"><i class="fas fa-moon theme-toggle__moon" aria-hidden="true"></i><i class="fas fa-sun theme-toggle__sun" aria-hidden="true"></i></a>
  </div>
</div>

<script>
  document.getElementById('theme-toggle').addEventListener('click', function (e) {
    e.preventDefault();
    var t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', t);
    try { localStorage.setItem('theme', t); } catch (err) {}
  });
</script>
